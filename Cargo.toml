[package]
name = "gray-signal"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Standalone Signal transport and setup for gray"

[lib]
name = "gray_signal"
path = "src/lib.rs"

[[bin]]
name = "gray-signal"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
